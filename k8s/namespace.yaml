apiVersion: v1
kind: Namespace
metadata:
  name: digital-twin-system
  labels:
    app.kubernetes.io/name: predictive-digital-twin
    app.kubernetes.io/part-of: green-building-ai
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: digital-twin-quota
  namespace: digital-twin-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "10"
