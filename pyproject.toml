[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-digital-twin-energy"
version = "1.0.0"
description = "Predictive Digital Twin with Hardware-Aware Multi-Objective Optimization for Commercial Building Energy Efficiency"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Adão de Jesus Braga", email = "braganetx@gmail.com" }
]
keywords = [
    "digital-twin",
    "energy-efficiency",
    "green-ai",
    "multi-objective-optimization",
    "nsga-ii",
    "kubernetes",
    "reproducible-research",
    "open-science",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "pymoo>=0.6.0",
    "psutil>=5.9.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
digital-twin-sim = "main:main"

[project.urls]
Homepage = "https://github.com/braganetx/predictive-digital-twin-energy"
Repository = "https://github.com/braganetx/predictive-digital-twin-energy.git"
"Preprint Paper (SSRN)" = "https://doi.org/10.2139/ssrn.7645518"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
