name: Scientific Reproducibility & Multi-Environment CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  scientific-validation:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scientific Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Hypothesis Integrity
        run: |
          python -c "
          import json, os
          assert os.path.exists('outputs/paper_results.json'), 'Results JSON missing'
          with open('outputs/paper_results.json') as f:
              res = json.load(f)
          assert res['section_5_2_H1']['H1_accepted'] is True, 'H1 not accepted'
          assert res['section_5_3_H2']['H2_accepted'] is True, 'H2 not accepted'
          assert res['section_5_4_H3']['H3_accepted'] is True, 'H3 not accepted'
          print('Hypotheses H1, H2, and H3 verified on Python ${{ matrix.python-version }}')
          "
