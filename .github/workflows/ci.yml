name: Reproducibility & Scientific Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Scientific Validation & Reproducibility Check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scientific Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Hypothesis Artifacts Integrity
        run: |
          python -c "
          import json, os
          assert os.path.exists('outputs/paper_results.json'), 'Results JSON missing'
          with open('outputs/paper_results.json') as f:
              res = json.load(f)
          assert res['section_5_2_H1']['H1_accepted'] is True, 'H1 not accepted'
          assert res['section_5_3_H2']['H2_accepted'] is True, 'H2 not accepted'
          assert res['section_5_4_H3']['H3_accepted'] is True, 'H3 not accepted'
          print('All paper hypotheses verified successfully!')
          "
